<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrera</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="login-container">
        <form id="registerForm">
            <h1>Skapa ditt konto</h1>
            <p>Välj ett användarnamn och lösenord</p>
            
            <input type="text" id="reg-username" placeholder="Användarnamn" required>
            <input type="password" id="reg-password" placeholder="Lösenord" required>
            
            <button type="submit">Registrera</button>
            <p id="reg-error-msg" style="color: red;"></p>
            
            <p><a href="index.html">Har du redan ett konto? Logga in här.</a></p>
        </form>
    </div>

    <script src="register.js"></script>
</body>
</html>
